<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="account-menu">
        <button
          type="button"
          id="user-icon"
          class="user-icon"
          aria-label="Teacher account"
          aria-expanded="false"
          aria-controls="account-popover"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" />
          </svg>
        </button>
        <div id="account-popover" class="account-popover hidden">
          <p id="account-status">Students can view activities and participants.</p>
          <button type="button" id="login-open">Teacher Login</button>
          <button type="button" id="logout-button" class="hidden">Log Out</button>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h2 id="login-title">Teacher Login</h2>
        <div class="form-group">
          <label for="teacher-username">Username</label>
          <input type="text" id="teacher-username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password</label>
          <input
            type="password"
            id="teacher-password"
            required
            autocomplete="current-password"
          />
        </div>
        <p id="login-error" class="error hidden" role="alert"></p>
        <div class="dialog-actions">
          <button type="submit">Log In</button>
          <button type="button" id="login-cancel" class="secondary-button">Cancel</button>
        </div>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activity-filters" aria-label="Filter and sort activities">
          <div class="filter-group">
            <label for="category-filter">Category</label>
            <select id="category-filter">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="sort-order">Sort by</label>
            <select id="sort-order">
              <option value="name">Name (A-Z)</option>
              <option value="schedule">Day and time</option>
            </select>
          </div>
          <div class="filter-group filter-group--search">
            <label for="activity-search">Search activities</label>
            <input
              type="search"
              id="activity-search"
              placeholder="Search by name, description, or schedule"
            />
          </div>
        </div>
        <div id="message" class="message hidden" role="status" aria-live="polite"></div>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
